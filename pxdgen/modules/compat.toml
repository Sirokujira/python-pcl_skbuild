# pcl/compat — C++ shims that live in THIS repo (src/pcl/compat/), not in
# PCL. They exist to expose one version-independent, Cython-expressible
# name for something the pxd layer cannot state directly.
# Only [[headers]] entries belong here; see pxdgen/pcl_headers.toml.

[[headers]]
path = "headers/pcl/compat/eigen_args.h"
extern_from = "pcl/compat/eigen_args.h"
output = "../src/pcl/pxd/compat/eigen_args.pxd"
namespaces = ["pclcompat"]
extra_cimports = [
    "from pcl.pxd.point_types cimport PointXYZ, Normal",
    "from pcl.pxd.filters.crop_box cimport CropBox",
    "from pcl.pxd.segmentation.sac_segmentation cimport SACSegmentation",
    "from pcl.pxd.segmentation.sac_segmentation_normals cimport SACSegmentationFromNormals",
]

