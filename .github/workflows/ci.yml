name: CI

# `push: branches: ["**"]` together with `pull_request` fires TWO complete
# runs for every push to a branch with an open PR — the same commit tested
# twice, in parallel, for nothing. Pushes are therefore limited to the
# default branch, and branch work rides the pull_request event alone.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Superseding a run cancels the one it replaced; without this, pushing
# three times in a minute occupies three full matrices of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # pxd generation pipeline + cython transpile checks: no PCL needed, runs
  # on every OS.
  pxd-pipeline:
    name: pxd-pipeline / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install clang (builtin headers for libclang) — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install LLVM (clang for builtin headers) — Windows
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      # macOS: Xcode Command Line Tools provide clang out of the box
      # NOTE: requires the sirokujira/cppast2autopxd repository to be
      # readable by CI; until it is on PyPI the git+ URL is the source.
      - name: Install cppast2autopxd + test deps
        run: |
          pip install "git+https://github.com/sirokujira/cppast2autopxd.git"
          pip install cython pytest
      - name: Verify committed pxd are up to date & wrapper transpiles
        run: pytest tests/test_pxd_pipeline.py -v

  # Full build against real PCL headers/libraries.
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PCL — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcl-dev
      - name: Install PCL — macOS
        if: runner.os == 'macOS'
        run: brew install pcl
      - name: Build package
        run: pip install -v .
      - name: Run runtime tests
        run: |
          pip install pytest
          pytest tests/test_pointcloud.py -v

  # The Windows build is its own job rather than a matrix entry: PCL via
  # vcpkg takes hours of compile time on hosted runners, so it comes
  # prebuilt from conda-forge instead — micromamba solves that in about a
  # minute. PCL_ROOT points into the env's Library\ prefix, which is
  # where conda-forge keeps headers, libs and PCLConfig.cmake; the same
  # variable at test time lets pcl/__init__.py add Library\bin as a DLL
  # directory (Python 3.8+ ignores PATH for extension dependencies).
  build-windows:
    name: build / windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PCL (prebuilt, conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pcl
          create-args: >-
            -c conda-forge
            pcl
            eigen
            flann
            libboost-devel
            qhull
      - name: Build package
        shell: pwsh
        run: |
          $pclRoot = "$env:MAMBA_ROOT_PREFIX\envs\pcl\Library"
          "PCL_ROOT=$pclRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PCL_ROOT = $pclRoot
          pip install -v .
      - name: Run runtime tests
        shell: pwsh
        run: |
          pip install pytest
          pytest tests/test_pointcloud.py -v
