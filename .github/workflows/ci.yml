name: CI

# Trigger discipline exists to keep the Actions quota alive.
#
# `push: branches: ["**"]` together with `pull_request` fires TWO complete
# runs for every push to a branch with an open PR — the same commit billed
# twice. Pushes are therefore limited to the default branch, and branch
# work is covered by the pull_request event alone.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Superseding a run cancels the one it replaced; without this, pushing
# three times in a minute pays for three full matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which runners this event deserves.
  #
  # macOS bills at 10x and Windows at 2x, so the full matrix costs ~67
  # billable minutes against ~10 for Linux alone. A draft PR iterating gets
  # Linux; the full matrix runs where it decides something — on the default
  # branch, when a PR is marked ready for review, and on demand.
  plan:
    name: pick runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pxd: ${{ steps.pick.outputs.pxd }}
      build: ${{ steps.pick.outputs.build }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'pxd=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'build=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'pxd=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'build=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Say what will run
        run: |
          echo "full matrix: ${{ steps.pick.outputs.full }}"
          echo "pxd-pipeline: ${{ steps.pick.outputs.pxd }}"
          echo "build: ${{ steps.pick.outputs.build }}"
          if [ "${{ steps.pick.outputs.full }}" != "true" ]; then
            echo "::notice::Draft PR — Linux only. Mark the PR ready for review to run macOS and Windows."
          fi

  # pxd generation pipeline + cython transpile checks: no PCL needed.
  pxd-pipeline:
    name: pxd-pipeline / ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.pxd) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install clang (builtin headers for libclang) — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install LLVM (clang for builtin headers) — Windows
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      # macOS: Xcode Command Line Tools provide clang out of the box
      # NOTE: requires the sirokujira/cppast2autopxd repository to be
      # readable by CI; until it is on PyPI the git+ URL is the source.
      - name: Install cppast2autopxd + test deps
        run: |
          pip install "git+https://github.com/sirokujira/cppast2autopxd.git"
          pip install cython pytest
      - name: Verify committed pxd are up to date & wrapper transpiles
        run: pytest tests/test_pxd_pipeline.py -v

  # Full build against real PCL headers/libraries.
  build:
    name: build / ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PCL — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcl-dev
      - name: Install PCL — macOS
        if: runner.os == 'macOS'
        run: brew install pcl
      - name: Build package
        run: pip install -v .
      - name: Run runtime tests
        run: |
          pip install pytest
          pytest tests/test_pointcloud.py -v

  # Windows build is not in the matrix yet: PCL via vcpkg takes hours of
  # compile time on hosted runners. The pxd-pipeline job above covers the
  # generator path on Windows; the extension build itself is exercised on
  # Linux/macOS. (Local Windows builds work via `pip install .` with a
  # PCL_ROOT install — see README.)
